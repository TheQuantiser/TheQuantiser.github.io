{{/* Site header with branding and navigation */}}
<header class="header" data-pagefind-ignore role="banner">
  <div class="header__inner">
    <div class="header__logo">{{ partial "logo.html" . }}</div>
    {{ partial "theme-toggle.html" . }}
    {{ if len $.Site.Menus }}{{ partial "mobile-menu.html" . }}{{ end }}
  </div>

  {{ if len $.Site.Menus }}{{ partial "menu.html" . }}{{ end }}
</header>
